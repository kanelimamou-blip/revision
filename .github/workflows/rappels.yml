name: Rappels de révision

# 13 h 15 et 17 h 15 à Dakar (UTC). GitHub peut décaler de quelques minutes.
on:
  schedule:
    - cron: "15 13 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Envoi
        working-directory: rappels
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: npm install --no-audit --no-fund && node envoyer.mjs
