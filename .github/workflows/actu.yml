name: Flash actu

# Toutes les 30 minutes : lecture des fils RSS de la presse, puis mise en ligne de docs/data/actu.json.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actu:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lire l'actualité
        run: python contenu/actu.py
      - name: Garder le fichier dans le dépôt
        run: |
          git config user.name "actu-bot"
          git config user.email "actu-bot@users.noreply.github.com"
          git add docs/data/actu.json
          git diff --cached --quiet || (git commit -m "Flash actu" && git pull --rebase && git push)
      - name: Questions et réglages
        run: python contenu/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
